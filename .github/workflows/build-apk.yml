name: Build Android WebView APK (<5MB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Ultra-Lightweight Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Baris cache sengaja dihapus agar tidak mencari package-lock.json

      - name: Install Web Dependencies & Build SPA
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor App
        run: |
          npx cap init "UsahaQu" "com.usahaqu.app" --web-dir .

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Build Optimized Lightweight APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UsahaQu-v1.70-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
